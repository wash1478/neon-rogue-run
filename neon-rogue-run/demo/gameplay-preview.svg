<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 270' width='480' height='270'>
  <rect width='100%' height='100%' fill='#001' />
  <rect y='230' width='100%' height='40' fill='#052'/>
  <g id='player'>
    <rect x='40' y='180' width='28' height='40' rx='6' fill='#0ff'/>
  </g>
  <g id='enemy'>
    <rect x='420' y='190' width='32' height='32' rx='6' fill='#f66'/>
