  <animateTransform xlink:href='#player' attributeName='transform' type='translate' from='0 0' to='8 0' dur='0.5s' begin='0s' repeatCount='indefinite' additive='sum' />
  <rect x='340' y='40' width='120' height='28' rx='8' fill='rgba(255,255,255,0.06)' />
