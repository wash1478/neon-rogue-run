<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ride Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head><body>
  <div class="wrap">
    <h1>Ride Tracker</h1>
    <form id="ride-form">
      <label>Distance (km): <input type="number" step="0.1" id="distance" required></label>
      <label>Date: <input type="date" id="date" required></label>
      <label>Time: <input type="time" id="time" required></label>
      <label>Choose route: <select id="route-select"><option value="">(none)</option></select></label>
      <button type="submit">Save Ride</button>
    </form>
    <div id="feed"></div>
    <div style="margin-top:12px">
      <button id="add-route">Add Route</button>
      <button id="draw-route">Draw</button>
      <button id="finish-route" style="display:none">Finish Route</button>
      <button id="clear-route" style="display:none">Clear Route</button>
    </div>
    <div id="map" style="height:320px;margin-top:12px;display:block"></div>
    <div id="routes-list" style="margin-top:12px"></div>
  </div>
  <div id="animation" style="pointer-events:none;"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body></html>
