<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001000">
  <title>Neon Rogue Run</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/player.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="start-overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:50"><button id="start-btn" style="font-size:20px;padding:12px 18px;border-radius:12px;background:#0ff;color:#001;border:none">Tap to Start</button></div>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="lives">Lives: 2</div>
      <div id="controls">
        <div id="joystick-left" class="joystick"><div id="stick-left" class="stick"></div></div>
        <div id="joystick-right" class="joystick"><div id="stick-right" class="stick"></div></div>
        <div id="action-buttons">
          <button id="jump">▲</button>
          <button id="shoot">●</button>
        </div>
      </div>
      <div id="save-load">
        <button id="save">Save</button>
        <button id="load">Load</button>
        <button id="highscores">High Scores</button>
      </div>
    </div>
  </div>
  <div id="highscore-modal" style="display:none;position:absolute;left:10%;top:20%;width:80%;background:rgba(0,0,0,0.9);color:#fff;padding:12px;border-radius:8px">
    <h3>High Scores</h3>
    <div id="highscore-list"></div>
    <div style="margin-top:8px"><button id="clear-scores">Clear</button> <button id="close-scores">Close</button></div>
  </div>
  <div id="gameover" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.7);color:#fff;align-items:center;justify-content:center;display:flex;flex-direction:column"><h1>Game Over</h1><div id="final-score"></div><button id="restart">Restart</button></div>
  <script src="audio.js"></script>
  <script src="joysticks.js"></script>
  <script src="main.js"></script>
</body>
</html>
