<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Trailblazer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="start-overlay.css">
</head>
<body>
  <div id="game-container">
    <div id="start-overlay"><button id="start-btn">Tap to Start (enable audio)</button></div>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="controls">
        <div id="joystick"><div id="stick"></div></div>
        <div id="action-buttons"><button id="accel">▶</button><button id="jump">▲</button><button id="trick">★</button></div>
      </div>
      <div id="save-load"><button id="save">Save</button><button id="load">Load</button></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
