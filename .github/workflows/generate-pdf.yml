name: Generate Checklist PDF
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Puppeteer
        run: |
          npm init -y
          npm i puppeteer
      - name: Render PDF
        run: node tools/render-pdf.js
      - name: Commit PDF to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B gh-pages
          mkdir -p health-report
          mv health-checklist/checklist.pdf health-report/checklist.pdf
          git add health-report/checklist.pdf
          git commit -m "chore: add generated checklist PDF"
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} gh-pages
